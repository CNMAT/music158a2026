<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>EC SFZ text pane</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white}
textarea{display:block;box-sizing:border-box;width:100%;height:100%;margin:0;padding:5px 6px;border:1px solid #777;border-radius:0;outline:none;resize:none;overflow:scroll;white-space:pre-wrap;overflow-wrap:break-word;font:12px/1.4 Menlo,Consolas,monospace;tab-size:4;scrollbar-gutter:stable;color:#000;background:#fff}
textarea:focus{border-color:#72728f}
textarea::-webkit-scrollbar{width:13px;height:13px}
textarea::-webkit-scrollbar-track,textarea::-webkit-scrollbar-corner{background:#e4e4e4}
textarea::-webkit-scrollbar-thumb{background:#777;border:3px solid #e4e4e4;border-radius:6px}
</style></head><body><textarea id="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="SFZ text" wrap="soft">Loading…</textarea>
<script>
(function(){
'use strict';
var field=document.getElementById('text'),config={readonly:1},transfer=null,busy=false;
function send(){if(window.max&&window.max.outlet)window.max.outlet.apply(window.max,arguments);}
function fail(e){send('error','x'+encodeURIComponent(String(e.message||e)));}
function rgba(a){return 'rgba('+a.slice(0,3).map(function(v){return Math.round(v*255);}).concat(a[3]).join(',')+')';}
var handlers={
 ec_config:function(encoded){try{config=JSON.parse(decodeURIComponent(String(encoded).substring(1)));field.readOnly=!!config.readonly;field.wrap=config.wrap?'soft':'off';field.style.whiteSpace=config.wrap?'pre-wrap':'pre';field.style.fontFamily='"'+config.font.replace(/[^\w -]/g,'')+'", Consolas, monospace';field.style.fontSize=config.fontsize+'px';field.style.background=rgba(config.background);field.style.color=rgba(config.foreground);field.setAttribute('aria-label',config.label);}catch(e){fail(e);}},
 ec_begin:function(id,count){transfer={id:id,count:count,parts:[]};},
 ec_chunk:function(id,index,text){if(transfer&&transfer.id===id)transfer.parts[index]=String(text).substring(1);},
 ec_end:function(id){try{if(!transfer||transfer.id!==id)return;for(var i=0;i<transfer.count;i++)if(typeof transfer.parts[i]!=='string')throw Error('Incomplete text update.');var value=decodeURIComponent(transfer.parts.join(''));transfer=null;if(value!==field.value){var top=field.scrollTop,left=field.scrollLeft;field.value=value;field.scrollTop=top;field.scrollLeft=left;}}catch(e){transfer=null;fail(e);}},
 ec_get:function(id){try{busy=true;field.readOnly=true;var s=encodeURIComponent(field.value.replace(/\r\n?/g,'\n')),count=Math.ceil(s.length/512);send('begin',id,count);for(var i=0;i<count;i++)send('chunk',id,i,'x'+s.substr(i*512,512));send('end',id);}catch(e){fail(e);}},
 ec_release:function(){busy=false;field.readOnly=!!config.readonly;},
 select:function(){field.focus();field.select();}
};
field.addEventListener('keydown',function(e){
 if(e.key==='Tab'&&!field.readOnly&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();document.execCommand('insertText',false,'    ');}
});
// Expose handlers for isolated browser regression tests; production uses Max's documented bridge.
window.ecPane={handlers:handlers,field:field};
function connect(){if(window.max&&window.max.bindInlet){Object.keys(handlers).forEach(function(n){window.max.bindInlet(n,handlers[n]);});send('ready');}else setTimeout(connect,50);}
connect();
})();
</script></body></html>
