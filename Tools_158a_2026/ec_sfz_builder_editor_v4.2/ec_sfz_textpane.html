<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>EC SFZ text pane</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white}
#pane{position:relative;width:100%;height:100%;--text-color:#000}
textarea{position:relative;z-index:1;display:block;box-sizing:border-box;width:100%;height:100%;margin:0;padding:5px 6px;border:1px solid #777;border-radius:0;outline:none;resize:none;overflow:scroll;white-space:pre-wrap;overflow-wrap:break-word;font:12px/1.4 Menlo,Consolas,monospace;tab-size:4;scrollbar-gutter:stable;color:#000;background:#fff}
textarea:focus{border-color:#72728f}
textarea::-webkit-scrollbar{width:13px;height:13px}
textarea::-webkit-scrollbar-track,textarea::-webkit-scrollbar-corner{background:#e4e4e4}
textarea::-webkit-scrollbar-thumb{background:#777;border:3px solid #e4e4e4;border-radius:6px}
#paintClip{position:absolute;z-index:0;overflow:hidden;pointer-events:none;user-select:none}
#paint{box-sizing:border-box;margin:0;padding:5px 6px;border:0;font:12px/1.4 Menlo,Consolas,monospace;tab-size:4;white-space:pre-wrap;overflow-wrap:break-word;transform-origin:0 0}
.sfz-line{min-height:1.4em;white-space:inherit;overflow-wrap:inherit}
.sfz-line.header-control{background:#e8eff5}
.sfz-line.header-global{background:#eee7f8}
.sfz-line.header-effect{background:#fbeadd}
.sfz-line.header-group{background:#e5f2e5}
.sfz-line.header-region{background:#e4f0fb}
.sfz-line.header-master{background:#eeeaf3}
.sfz-line.header-curve{background:#f6f0d8}
.sfz-line.header-other{background:#edf0f2}
/* Extra ink makes headers bold-looking without changing caret/wrap metrics. */
.sfz-header{text-shadow:.35px 0 currentColor,-.2px 0 currentColor;color:#334754}
.sfz-header.token-control{color:#364f67}.sfz-header.token-global{color:#614080}
.sfz-header.token-effect{color:#814b26}.sfz-header.token-group{color:#2d633e}
.sfz-header.token-region{color:#285c88}.sfz-comment{color:#626b75}
.syntax #text{background:transparent!important;color:transparent!important;caret-color:var(--text-color)}
.syntax #text::selection{background:rgba(88,140,220,.35);color:transparent}
#samples{height:100%;display:flex;flex-direction:column;font:11px/1.4 Menlo,Consolas,monospace;color:#18232b}
#samples[hidden]{display:none}
.sample-mode #text{display:none}
#sampleTools{display:flex;align-items:center;gap:6px;flex:none;min-height:23px;box-sizing:border-box;padding:2px 5px;background:#eef1f5;border:1px solid #777;border-bottom:0;white-space:nowrap;overflow-x:auto}
#sampleTools button{font:11px/16px Arial,sans-serif;border:1px solid #8d9aaa;border-radius:3px;background:#fff;color:#213b50;padding:0 7px;white-space:nowrap;cursor:pointer}
#sampleTools button:disabled{opacity:.5;cursor:default}
#sampleTools #addSamples{background:#dfeaf7}
#sampleCount{font:10px/16px Arial,sans-serif;color:#465765}
#sampleHelp{margin-left:auto;font:10px/16px Arial,sans-serif;color:#465765}
#sampleList{flex:1;min-height:0;overflow:scroll;border:1px solid #777;outline:none;user-select:none;scrollbar-gutter:stable}
#sampleList:focus{border-color:#456f9b}
.sample-row{display:flex;align-items:center;gap:5px;box-sizing:border-box;min-width:100%;width:max-content;min-height:18px;padding:1px 7px 1px 5px;cursor:default;white-space:pre}
.sample-row:nth-child(even){background:#f4f6f8}
.sample-row[aria-selected="true"]{background:#dbeafa;color:#122e48}
.sample-row.active{box-shadow:inset 0 0 0 1px #577ea5}
.sample-check{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;width:12px;height:12px;flex:none;border:1px solid #91a1af;border-radius:2px;font:11px Arial,sans-serif;color:transparent;background:#fff;cursor:pointer}
[aria-selected="true"] .sample-check{background:#537ea7;border-color:#537ea7;color:#fff}
.sample-empty{padding:3px 6px;color:#626b75}
#sampleList::-webkit-scrollbar{width:13px;height:13px}
#sampleList::-webkit-scrollbar-track,#sampleList::-webkit-scrollbar-corner{background:#e4e4e4}
#sampleList::-webkit-scrollbar-thumb{background:#777;border:3px solid #e4e4e4;border-radius:6px}
@media(max-width:700px){#sampleHelp{display:none}}
@media (forced-colors:active){.syntax #text{background:Canvas!important;color:CanvasText!important;caret-color:auto}#paintClip{display:none}}
</style></head><body>
<div id="pane"><div id="paintClip" aria-hidden="true" hidden><div id="paint"></div></div><textarea id="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="SFZ text" wrap="soft">Loading…</textarea>
<div id="samples" hidden><div id="sampleTools">
<button id="addSamples" disabled title="Add the selected rows to the selected scope's group, on its lowest free MIDI keys. Uses the home-page velocity range.">Add selected samples</button>
<button id="allSamples" title="Select every sample in this folder list. Command/Ctrl+A also selects all.">All</button>
<button id="clearSelection" title="Clear this selection. Loaded samples and disk files are unchanged.">Clear selection</button>
<span id="sampleCount" role="status" aria-live="polite">0 selected</span>
<span id="sampleHelp">Shift: range · Cmd/Ctrl: separate</span>
</div><div id="sampleList" role="listbox" aria-label="Soundfiles" aria-multiselectable="true" tabindex="0"></div></div></div>
<script>
(function(){
'use strict';
var field=document.getElementById('text'),pane=document.getElementById('pane'),clip=document.getElementById('paintClip'),paint=document.getElementById('paint');
var config={readonly:1},transfer=null,busy=false,highlight=false,composing=false,paintQueued=false,lineCache=[];
var knownHeaders={control:1,global:1,effect:1,group:1,region:1,master:1,curve:1};
var samples=document.getElementById('samples'),sampleList=document.getElementById('sampleList'),addSamples=document.getElementById('addSamples');
var sampleMode=false,sampleVersion=-1,sampleLines=[],sampleSelected={},sampleAnchor=-1,sampleFocus=-1,sampleBusy=false,sampleRequest=0;
function send(){if(window.max&&window.max.outlet)window.max.outlet.apply(window.max,arguments);}
function fail(e){send('error','x'+encodeURIComponent(String(e.message||e)));}
function selectedIndices(){var out=[];for(var i=0;i<sampleLines.length;i++)if(sampleSelected[i])out.push(i);return out;}
function refreshSelection(){
 var rows=sampleList.children,count=0;
 for(var i=0;i<sampleLines.length;i++){
  var selected=!!sampleSelected[i];if(selected)count++;
  rows[i].setAttribute('aria-selected',String(selected));rows[i].classList.toggle('active',i===sampleFocus);
 }
 if(sampleFocus>=0)sampleList.setAttribute('aria-activedescendant','sample-row-'+sampleFocus);else sampleList.removeAttribute('aria-activedescendant');
 document.getElementById('sampleCount').textContent=count+' / '+sampleLines.length+' selected';
 addSamples.disabled=sampleBusy||!count;addSamples.textContent=sampleBusy?'Adding…':'Add selected samples';
 document.getElementById('allSamples').disabled=!sampleLines.length;
 document.getElementById('clearSelection').disabled=!count;
}
function selectAllSamples(){sampleSelected={};for(var i=0;i<sampleLines.length;i++)sampleSelected[i]=true;if(sampleLines.length){sampleFocus=0;sampleAnchor=0;}refreshSelection();}
function clearSampleSelection(){sampleSelected={};sampleAnchor=-1;refreshSelection();}
function chooseSample(index,range,toggle){
 if(index<0||index>=sampleLines.length)return;
 if(range){
  if(sampleAnchor<0)sampleAnchor=sampleFocus>=0?sampleFocus:index;
  if(!toggle)sampleSelected={};
  for(var i=Math.min(sampleAnchor,index);i<=Math.max(sampleAnchor,index);i++)sampleSelected[i]=true;
 }else{if(!toggle)sampleSelected={};sampleSelected[index]=toggle?!sampleSelected[index]:true;sampleAnchor=index;}
 sampleFocus=index;refreshSelection();
}
function renderSamples(value){
 var data=JSON.parse(value);
 if(!data||typeof data.version!=='number'||!Array.isArray(data.lines)||data.lines.length>10000)throw Error('Invalid soundfile list.');
 for(var n=0;n<data.lines.length;n++)if(typeof data.lines[n]!=='string')throw Error('Invalid sample row.');
 var reset=data.version!==sampleVersion,top=sampleList.scrollTop,left=sampleList.scrollLeft;
 if(reset){sampleSelected={};sampleAnchor=-1;sampleFocus=-1;top=0;left=0;}
 sampleVersion=data.version;sampleLines=data.lines.slice();field.value=sampleLines.join('\n');
 var fragment=document.createDocumentFragment();
 for(var i=0;i<sampleLines.length;i++){
  var row=document.createElement('div'),check=document.createElement('span'),label=document.createElement('span');
  row.className='sample-row';row.id='sample-row-'+i;row.dataset.index=String(i);row.setAttribute('role','option');row.title=sampleLines[i];
  check.className='sample-check';check.textContent='✓';check.setAttribute('aria-hidden','true');
  label.textContent=sampleLines[i];row.appendChild(check);row.appendChild(label);fragment.appendChild(row);
 }
 if(!sampleLines.length){var empty=document.createElement('div');empty.className='sample-empty';empty.textContent=data.notice||'Load a sound folder to choose samples.';fragment.appendChild(empty);}
 sampleList.textContent='';sampleList.appendChild(fragment);refreshSelection();sampleList.scrollTop=top;sampleList.scrollLeft=left;
}
sampleList.addEventListener('click',function(e){
 var row=e.target.closest('.sample-row');if(!row)return;
 chooseSample(Number(row.dataset.index),e.shiftKey,e.ctrlKey||e.metaKey||e.target.classList.contains('sample-check'));
 sampleList.focus({preventScroll:true});
});
sampleList.addEventListener('keydown',function(e){
 var command=e.ctrlKey||e.metaKey,index=sampleFocus<0?0:sampleFocus;
 if(command&&e.key.toLowerCase()==='a'){e.preventDefault();selectAllSamples();return;}
 if(e.key==='Escape'){e.preventDefault();clearSampleSelection();return;}
 if(!sampleLines.length)return;
 if(e.key===' '){e.preventDefault();chooseSample(index,e.shiftKey,true);return;}
 if(e.key==='ArrowDown')index=sampleFocus<0?0:Math.min(sampleLines.length-1,index+1);
 else if(e.key==='ArrowUp')index=Math.max(0,index-1);
 else if(e.key==='Home')index=0;
 else if(e.key==='End')index=sampleLines.length-1;
 else return;
 e.preventDefault();
 if(command&&!e.shiftKey){sampleFocus=index;refreshSelection();}else chooseSample(index,e.shiftKey,command);
 sampleList.children[index].scrollIntoView({block:'nearest',inline:'nearest'});
});
document.getElementById('allSamples').addEventListener('click',selectAllSamples);
document.getElementById('clearSelection').addEventListener('click',clearSampleSelection);
document.addEventListener('copy',function(e){
 if(!sampleMode||document.activeElement!==sampleList||!e.clipboardData)return;
 e.clipboardData.setData('text/plain',selectedIndices().map(function(i){return sampleLines[i];}).join('\n'));e.preventDefault();
});
addSamples.addEventListener('click',function(){
 var indices=selectedIndices();if(sampleBusy||!indices.length)return;
 sampleBusy=true;refreshSelection();
 try{
  var text=encodeURIComponent(JSON.stringify(indices)),id=++sampleRequest,count=Math.ceil(text.length/512);
  send('samples_begin',id,sampleVersion,count);
  for(var i=0;i<count;i++)send('samples_chunk',id,i,'x'+text.substr(i*512,512));
  send('samples_end',id);
 }catch(e){sampleBusy=false;refreshSelection();fail(e);}
});
function rgba(a){return 'rgba('+a.slice(0,3).map(function(v){return Math.round(v*255);}).concat(a[3]).join(',')+')';}
function append(row,text,kind){
 if(!text)return;
 if(!kind){row.appendChild(document.createTextNode(text));return;}
 var span=document.createElement('span');span.className=kind;span.textContent=text;row.appendChild(span);
}
function paintLine(text,inBlock){
 var row=document.createElement('div'),i=0,end,m,firstHeader='',block=inBlock;
 var tokens=/\/\/|\/\*|<([A-Za-z_][A-Za-z_0-9]*)>/g;
 row.className='sfz-line';
 while(i<text.length){
  if(block){
   end=text.indexOf('*/',i);
   if(end<0){append(row,text.slice(i),'sfz-comment');i=text.length;break;}
   append(row,text.slice(i,end+2),'sfz-comment');i=end+2;block=false;continue;
  }
  tokens.lastIndex=i;m=tokens.exec(text);
  if(!m){append(row,text.slice(i));break;}
  append(row,text.slice(i,m.index));i=m.index;
  if(m[0]==='//'){append(row,text.slice(i),'sfz-comment');break;}
  if(m[0]==='/*'){
   end=text.indexOf('*/',i+2);
   if(end<0){append(row,text.slice(i),'sfz-comment');block=true;break;}
   append(row,text.slice(i,end+2),'sfz-comment');i=end+2;continue;
  }
  var type=m[1].toLowerCase(),kind=Object.prototype.hasOwnProperty.call(knownHeaders,type)?type:'other';
  if(!firstHeader)firstHeader=kind;
  append(row,m[0],'sfz-header token-'+kind);i+=m[0].length;
 }
 if(firstHeader)row.className+=' header-'+firstHeader;
 return {text:text,inBlock:inBlock,outBlock:block,row:row};
}
function syncGeometry(){
 if(!highlight||composing)return;
 // clientWidth/Height exclude native borders and scrollbars, but include padding.
 clip.style.left=field.clientLeft+'px';clip.style.top=field.clientTop+'px';
 clip.style.width=field.clientWidth+'px';clip.style.height=field.clientHeight+'px';
 paint.style.width=(config.wrap?field.clientWidth:Math.max(field.clientWidth,field.scrollWidth))+'px';
 paint.style.transform='translate('+(-field.scrollLeft)+'px,'+(-field.scrollTop)+'px)';
}
function refreshHighlight(){
 if(!highlight||composing)return;
 var lines=field.value.split('\n'),block=false,i,entry;
 for(i=0;i<lines.length;i++){
  entry=lineCache[i];
  if(!entry||entry.text!==lines[i]||entry.inBlock!==block)entry=paintLine(lines[i],block);
  block=entry.outBlock;lineCache[i]=entry;
  if(paint.childNodes[i]!==entry.row){
   if(paint.childNodes[i])paint.replaceChild(entry.row,paint.childNodes[i]);else paint.appendChild(entry.row);
  }
 }
 while(paint.childNodes.length>lines.length)paint.removeChild(paint.lastChild);
 lineCache.length=lines.length;syncGeometry();
}
function schedulePaint(){
 if(paintQueued)return;paintQueued=true;
 var frame=window.requestAnimationFrame||function(f){return setTimeout(f,16);};
 frame(function(){paintQueued=false;refreshHighlight();});
}
function showHighlight(){
 var visible=highlight&&!composing;
 pane.classList.toggle('syntax',visible);clip.hidden=!visible;
 if(visible)refreshHighlight();
}
function configure(encoded){
 config=JSON.parse(decodeURIComponent(String(encoded).substring(1)));
 field.readOnly=busy||!!config.readonly;field.wrap=config.wrap?'soft':'off';
 field.style.whiteSpace=config.wrap?'pre-wrap':'pre';
 field.style.fontFamily='"'+config.font.replace(/[^\w -]/g,'')+'", Consolas, monospace';
 field.style.fontSize=config.fontsize+'px';field.style.background=rgba(config.background);field.style.color=rgba(config.foreground);
 field.setAttribute('aria-label',config.label);
 pane.style.background=field.style.background;pane.style.setProperty('--text-color',field.style.color);
 paint.style.whiteSpace=field.style.whiteSpace;paint.style.fontFamily=field.style.fontFamily;paint.style.fontSize=field.style.fontSize;paint.style.color=field.style.color;
 // The builder uses this same HTML for its read-only lists and reports.
 sampleMode=config.mode==='samples';samples.hidden=!sampleMode;pane.classList.toggle('sample-mode',sampleMode);
 sampleList.style.fontFamily=field.style.fontFamily;sampleList.style.fontSize=field.style.fontSize;sampleList.setAttribute('aria-label',config.label);
 highlight=!config.readonly&&!sampleMode;showHighlight();
}
var handlers={
 ec_config:function(encoded){try{configure(encoded);}catch(e){fail(e);}},
 ec_begin:function(id,count){transfer={id:id,count:count,parts:[]};},
 ec_chunk:function(id,index,text){if(transfer&&transfer.id===id)transfer.parts[index]=String(text).substring(1);},
 ec_end:function(id){try{if(!transfer||transfer.id!==id)return;for(var i=0;i<transfer.count;i++)if(typeof transfer.parts[i]!=='string')throw Error('Incomplete text update.');var value=decodeURIComponent(transfer.parts.join(''));transfer=null;if(sampleMode){renderSamples(value);return;}if(value!==field.value){var top=field.scrollTop,left=field.scrollLeft;field.value=value;field.scrollTop=top;field.scrollLeft=left;}refreshHighlight();}catch(e){transfer=null;fail(e);}},
 // Only the textarea value is sent to Max. Highlight nodes never enter the SFZ.
 ec_get:function(id){try{busy=true;field.readOnly=true;var s=encodeURIComponent(field.value.replace(/\r\n?/g,'\n')),count=Math.ceil(s.length/512);send('begin',id,count);for(var i=0;i<count;i++)send('chunk',id,i,'x'+s.substr(i*512,512));send('end',id);}catch(e){fail(e);}},
 ec_release:function(){busy=false;field.readOnly=!!config.readonly;},
 ec_samples_done:function(){sampleBusy=false;refreshSelection();},
 select:function(){if(sampleMode){selectAllSamples();sampleList.focus();}else{field.focus();field.select();}}
};
field.addEventListener('keydown',function(e){
 if(e.key==='Tab'&&!field.readOnly&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();document.execCommand('insertText',false,'    ');schedulePaint();}
});
field.addEventListener('input',schedulePaint);
field.addEventListener('scroll',syncGeometry);
field.addEventListener('compositionstart',function(){composing=true;showHighlight();});
field.addEventListener('compositionend',function(){composing=false;showHighlight();});
window.addEventListener('resize',syncGeometry);
if(typeof ResizeObserver==='function')new ResizeObserver(syncGeometry).observe(field);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(syncGeometry);
// Expose handlers for isolated browser regression tests; production uses Max's documented bridge.
window.ecPane={handlers:handlers,field:field};
function connect(){if(window.max&&window.max.bindInlet){Object.keys(handlers).forEach(function(n){window.max.bindInlet(n,handlers[n]);});send('ready');}else setTimeout(connect,50);}
connect();
})();
</script></body></html>
